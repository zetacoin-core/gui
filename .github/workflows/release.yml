# Zetacoin Core Release — runs only on version tags
# Builds distributable archives for Linux, macOS, and Windows
# Creates a GitHub Release with the archives attached
#
# Approach: use cmake --install with --strip to collect all binaries,
# avoiding manual binary name lists. Bitcoin Core uses this pattern
# via GOAL="install" in their CI scripts.

name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    name: 'Linux x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkgconf libevent-dev libboost-dev libsqlite3-dev libzmq3-dev qt6-base-dev qt6-tools-dev qt6-l10n-tools libqrencode-dev libgl-dev

      - name: Configure
        run: cmake -B build -DBUILD_GUI=ON -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Install
        run: cmake --install build --prefix install --strip

      - name: Package
        run: |
          DIST=zetacoin-${VERSION#v}-linux-x86_64
          mv install ${DIST}
          cp COPYING README.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}
          sha256sum ${DIST}.tar.gz > ${DIST}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: zetacoin-*-linux-x86_64.tar.gz*

  macos:
    name: 'macOS ${{ matrix.arch }}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew install --quiet cmake boost libevent pkgconf sqlite zmq qt@6 qrencode create-dmg librsvg

      - name: Configure
        run: cmake -B build -DBUILD_GUI=ON -DBUILD_TESTS=OFF -DBUILD_BENCH=OFF -DENABLE_IPC=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Create app bundle
        working-directory: build
        run: cmake --build . --target deploy

      - name: Generate DMG background from SVG
        run: |
          rsvg-convert -w 1000 -h 640 \
            "${GITHUB_WORKSPACE}/contrib/macdeploy/dmg-background.svg" \
            -o "${GITHUB_WORKSPACE}/build/dmg-background.png"

      - name: Create DMG
        working-directory: build
        run: |
          VOLNAME="Zetacoin-Core"
          DMG_NAME="zetacoin-${VERSION#v}-macos-${{ matrix.arch }}.dmg"
          # Find the .app bundle
          if [ -d "dist/Zetacoin-Qt.app" ]; then
            APP_PATH="dist/Zetacoin-Qt.app"
          else
            APP_PATH="Zetacoin-Qt.app"
          fi
          # Rename to "Zetacoin Core.app" for cleaner display in DMG
          cp -R "${APP_PATH}" "Zetacoin Core.app"
          # Create branded DMG with Firefox-style layout
          create-dmg \
            --volname "${VOLNAME}" \
            --background "dmg-background.png" \
            --window-pos 200 120 \
            --window-size 500 320 \
            --icon-size 128 \
            --icon "Zetacoin Core.app" 130 150 \
            --app-drop-link 370 150 \
            --hide-extension "Zetacoin Core.app" \
            --no-internet-enable \
            "${DMG_NAME}" \
            "Zetacoin Core.app" || true
          shasum -a 256 "${DMG_NAME}" > "${DMG_NAME}.sha256"

      - name: Also package as tarball
        working-directory: build
        run: |
          DIST=zetacoin-${VERSION#v}-macos-${{ matrix.arch }}
          cmake --install "${GITHUB_WORKSPACE}/build" --prefix "${GITHUB_WORKSPACE}/${DIST}" --strip
          cd "${GITHUB_WORKSPACE}"
          cp COPYING README.md ${DIST}/
          tar czf ${DIST}.tar.gz ${DIST}
          shasum -a 256 ${DIST}.tar.gz > ${DIST}.tar.gz.sha256

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: build/zetacoin-*-macos-${{ matrix.arch }}.dmg*

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-tarball
          path: zetacoin-*-macos-${{ matrix.arch }}.tar.gz*

  windows:
    name: 'Windows x86_64 (cross-compiled)'
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64-posix nsis zip osslsigncode

      - name: Restore depends cache
        uses: actions/cache/restore@v4
        id: depends-cache
        with:
          path: depends/built
          key: depends-mingw-${{ hashFiles('depends/packages/*.mk') }}

      - name: Build dependencies
        run: make -C depends HOST=x86_64-w64-mingw32 -j$(nproc)

      - name: Save depends cache
        uses: actions/cache/save@v4
        if: steps.depends-cache.outputs.cache-hit != 'true'
        with:
          path: depends/built
          key: depends-mingw-${{ hashFiles('depends/packages/*.mk') }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$(pwd)/depends/x86_64-w64-mingw32/toolchain.cmake \
            -DBUILD_GUI=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_BENCH=OFF \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Build NSIS installer
        working-directory: build
        run: cmake --build . --target deploy
        continue-on-error: true

      - name: Sign Windows binaries
        if: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
        uses: pacyworld/codesign-action@master
        with:
          pfx_base64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          pfx_password: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          files: "build/bin/*.exe"
          name: "Zetacoin Core"
          url: "https://www.getzetacoin.com"

      - name: Sign NSIS installer
        if: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
        uses: pacyworld/codesign-action@master
        with:
          pfx_base64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          pfx_password: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          files: "build/zetacoin-win64-setup.exe"
          name: "Zetacoin Core"
          url: "https://www.getzetacoin.com"
        continue-on-error: true

      - name: Package zip
        run: |
          DIST=zetacoin-${VERSION#v}-windows-x86_64
          mkdir -p ${DIST}
          cp build/bin/zetacoin.exe build/bin/zetacoin-qt.exe \
             build/bin/zetacoind.exe build/bin/zetacoin-cli.exe \
             build/bin/zetacoin-tx.exe build/bin/zetacoin-wallet.exe \
             build/bin/zetacoin-util.exe ${DIST}/ 2>/dev/null || true
          cp COPYING README.md ${DIST}/
          zip -r ${DIST}.zip ${DIST}
          sha256sum ${DIST}.zip > ${DIST}.zip.sha256

      - name: Package installer
        run: |
          INSTALLER=$(find build -name "zetacoin-win64-setup.exe" 2>/dev/null | head -1)
          if [ -n "$INSTALLER" ]; then
            VER=${VERSION#v}
            cp "$INSTALLER" "zetacoin-${VER}-win64-setup.exe"
            sha256sum "zetacoin-${VER}-win64-setup.exe" > "zetacoin-${VER}-win64-setup.exe.sha256"
          fi

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-zip
          path: zetacoin-*-windows-x86_64.zip*

      - name: Upload installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: windows-x86_64-setup
          path: zetacoin-*-win64-setup.exe*
          if-no-files-found: ignore

  release:
    name: 'Create GitHub Release'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Zetacoin Core ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
