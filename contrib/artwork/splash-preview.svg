<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <!-- Teal gradient for left panel -->
    <linearGradient id="teal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D4F5A;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1A6B85;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1D6F89;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14505E;stop-opacity:1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="0.4" />
    </filter>
    <!-- Clip to left 33% -->
    <clipPath id="left-panel">
      <rect x="0" y="0" width="160" height="320"/>
    </clipPath>
    <!-- Emboss-like effect for the zeta symbol -->
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" in="SourceGraphic" result="blur1"/>
      <feSpecularLighting specularExponent="20" specularConstant="0.8" surfaceScale="3" lighting-color="#ffffff" result="spec" in="blur1">
        <feDistantLight azimuth="235" elevation="45"/>
      </feSpecularLighting>
      <feComposite operator="in" in="spec" in2="SourceGraphic" result="specOut"/>
      <feComposite operator="over" in="specOut" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Window background (light gray like Qt default) -->
  <rect width="480" height="320" fill="#f0f0f0"/>

  <!-- LEFT PANEL: Teal gradient background (33% = 160px) -->
  <rect x="0" y="0" width="160" height="320" fill="url(#teal-bg)"/>

  <!-- Binary code overlay on left panel -->
  <g clip-path="url(#left-panel)" fill="#FFFFFF" font-family="'Courier New', monospace" font-size="8" font-weight="bold" opacity="0.08" filter="url(#blur)">
    <text x="-20" y="12">01001010 11010010 00110101 10101100 01110010 11001010 01010110</text>
    <text x="-10" y="24">10110101 00101101 11001010 01010110 10110100 00110101 10101100</text>
    <text x="-25" y="36">00101010 11010110 01010100 10110010 11001101 00101011 10100110</text>
    <text x="-5" y="48">11001010 01010110 10110100 00101101 01001010 11010010 00110101</text>
    <text x="-15" y="60">01010101 10110010 11001100 10100101 00101010 11010110 01010100</text>
    <text x="-22" y="72">10100110 01011010 01110101 10011010 01101100 10101001 01010110</text>
    <text x="-8" y="84">01110010 11001010 01010110 10110100 00101101 01101011 10010101</text>
    <text x="-18" y="96">11001101 00101011 10100110 01011010 01110101 10011010 01101100</text>
    <text x="-12" y="108">00110101 10101100 01110010 11001010 01010110 10110100 00101101</text>
    <text x="-20" y="120">01101011 10010101 01011010 10110010 01010101 11001100 10100101</text>
    <text x="-6" y="132">10011010 01101100 10101001 01010110 11001010 00110101 10101100</text>
    <text x="-25" y="144">10100101 00101010 11010110 01010100 10110010 11001101 00101011</text>
    <text x="-10" y="156">10101100 01001010 11010010 00110101 10101100 01110010 11001010</text>
    <text x="-16" y="168">10100101 00101010 11010110 01010100 10110010 11001101 00101011</text>
    <text x="-22" y="180">01001010 11010010 00101101 01101011 10010101 01011010 10110010</text>
    <text x="-8" y="192">10100110 01011010 01110101 10011010 01101100 10101001 01010110</text>
    <text x="-14" y="204">01110010 11001010 01010110 10110100 00101101 01101011 10010101</text>
    <text x="-20" y="216">11001101 00101011 10100110 01011010 01110101 10011010 01101100</text>
    <text x="-5" y="228">10010101 01011010 10110010 01010101 11001100 10100101 00101010</text>
    <text x="-18" y="240">01101100 10101001 01010110 11001010 00110101 10101100 01110010</text>
    <text x="-12" y="252">00101101 01101011 10010101 01011010 10110010 01010101 11001100</text>
    <text x="-24" y="264">01110101 10011010 01101100 10101001 01010110 11001010 00110101</text>
    <text x="-8" y="276">11001100 10100101 00101010 11010110 01010100 10110010 11001101</text>
    <text x="-15" y="288">00110101 10101100 01110010 11001010 01010110 10110100 00101101</text>
    <text x="-20" y="300">01101011 10010101 01011010 10110010 01010101 11001100 10100101</text>
    <text x="-10" y="312">10011010 01101100 10101001 01010110 11001010 00110101 10101100</text>
  </g>

  <!-- Zeta symbol centered on left panel (simplified white S-curve) -->
  <g transform="translate(80, 160) scale(0.45)" opacity="0.25">
    <path fill="#ffffff" d="M -80,-180 C -60,-200 40,-160 60,-140 C 100,-100 80,0 40,40 C 0,80 -80,100 -40,140 C -20,160 60,180 80,160" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- RIGHT SIDE: Title and text, positioned a few pixels left of the background edge -->
  <!-- Title: "Zetacoin Core" -->
  <text x="168" y="60" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333">Zetacoin Core</text>

  <!-- Version -->
  <text x="168" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#666666">Version v0.14.0</text>

  <!-- Copyright lines -->
  <text x="168" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888888">Copyright (C) 2013-2026 The Zetacoin Core</text>
  <text x="168" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888888">developers</text>
  <text x="168" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888888">Copyright (C) 2009-2026 The Bitcoin Core</text>
  <text x="168" y="161" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" fill="#888888">developers</text>

  <!-- Loading status: horizontally centered in right section, near bottom -->
  <text x="320" y="305" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#555555">Loading block index...</text>
</svg>
